[book]
title = "Besedarium Protocol Framework"
description = "A comprehensive guide to the Besedarium protocol framework for type-safe distributed communication"
authors = ["Besedarium Contributors"]
language = "en"
multilingual = false
src = "."

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html]
additional-css = ["custom.css"]
additional-js = ["mermaid.min.js", "mermaid-init.js"]

[output.html.playground]
copyable = true
copy-js = true

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
